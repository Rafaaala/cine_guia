<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guia de Cinema</title>
    <link rel="stylesheet" href="./styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
  </head>

  <body>
    <header>
      <div class="header-inner">
        <button
          class="menu-toggle"
          onclick="toggleMenu()"
          aria-expanded="false"
          aria-controls="sidebar"
          aria-label="Abrir menu"
        >
          <span class="material-symbols-outlined">menu</span>
        </button>

        <h1 class="header-title">CineGuia</h1>

        <nav class="header-nav">
          <a href="#inicio">Início</a>
          <span class="nav-separator" aria-hidden="true">|</span>
          <a href="#filmes">Filmes</a>
          <span class="nav-separator" aria-hidden="true">|</span>
          <a href="#series">Séries</a>
          <span class="nav-separator" aria-hidden="true">|</span>
          <a href="#contato">Contato</a>
        </nav>
      </div>
    </header>

    <aside
      class="sidebar"
      id="sidebar"
      aria-label="Navegação de gêneros"
      aria-hidden="true"
    >
      <button
        class="sidebar-close"
        onclick="toggleMenu()"
        aria-label="Fechar menu"
      >
        <span class="material-symbols-outlined">close</span>
      </button>

      <h2>Gêneros</h2>

      <ul class="sidebar-list">
        <li><button type="button">Terror</button></li>
        <li><button type="button">Comédia</button></li>
        <li><button type="button">Drama</button></li>
        <li><button type="button">Documentário</button></li>
        <li>
          <button
            class="theme-toggle"
            onclick="toggleTheme()"
            type="button"
            aria-label="Alternar tema"
          >
            <span class="material-symbols-outlined">contrast</span>
            Tema
          </button>
        </li>
        <li>
          <button
            class="sidebar-logout"
            type="button"
            onclick="window.location.href = './pages/cadastro.html'"
            aria-label="Sair"
          >
            Sair
          </button>
        </li>
      </ul>
    </aside>

    <div
      class="backdrop"
      id="backdrop"
      onclick="closeMenu()"
      aria-hidden="true"
    ></div>

    <div class="layout">
      <main class="main">
        <div class="filtros">
          <input type="radio" name="genero" id="todos" checked />
          <label for="todos">Todos</label>

          <input type="radio" name="genero" id="terror" />
          <label for="terror">Terror</label>

          <input type="radio" name="genero" id="comedia" />
          <label for="comedia">Comédia</label>

          <input type="radio" name="genero" id="drama" />
          <label for="drama">Drama</label>

          <input type="radio" name="genero" id="documentario" />
          <label for="documentario">Documentário</label>
        </div>

        <div id="catalogo" class="grid" aria-live="polite" aria-busy="true">
          <p class="message" role="status">Carregando conteúdos...</p>
        </div>
      </main>
    </div>

    <footer>
      <p>© 2026 Guia de Cinema. Todos os direitos reservados.</p>
    </footer>

    <div id="movieModal" class="modal hidden" aria-hidden="true">
      <div
        class="modal-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
      >
        <div id="modalContent"></div>
      </div>
    </div>

    <script src="./js/main.js"></script>
    <script src="./js/cards.js"></script>
  </body>
</html>
